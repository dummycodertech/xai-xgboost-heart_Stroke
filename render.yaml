services:
  - type: web
    name: stroke-xai-api
    runtime: python
    plan: free
    buildCommand: "pip install -r api/requirements.txt"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://stroke-xai-frontend.vercel.app
      - key: VERCEL_PREVIEW_REGEX
        value: '^https:\/\/stroke-xai-frontend(-[a-z0-9-]+)?-dummycodertechs-projects\.vercel\.app$'
      - key: TRUSTED_PROXIES
        value: "127.0.0.1,::1"
